<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ECHO-Q // Control Center</title>
  <style>
    /* ── Reset & base ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0d0f;
      --panel:    #0d1117;
      --border:   #1c2a1c;
      --green:    #00ff88;
      --green-dim:#00aa55;
      --cyan:     #00e5ff;
      --amber:    #ffb300;
      --red:      #ff3d3d;
      --text:     #c8d6c8;
      --dim:      #4a6050;
      --font:     'Courier New', 'Lucida Console', monospace;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text);
                 font-family: var(--font); font-size: 13px; overflow-x: hidden; }

    /* ── Scanline overlay ─────────────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 9999;
      background: repeating-linear-gradient(
        to bottom, transparent 0px, transparent 2px,
        rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
    }

    /* ── Header ───────────────────────────────────────────────────────── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; border-bottom: 1px solid var(--border);
      background: #080b0d;
    }
    .logo { color: var(--green); font-size: 18px; font-weight: bold;
            letter-spacing: 4px; text-shadow: 0 0 12px var(--green); }
    .logo span { color: var(--dim); font-size: 11px; margin-left: 12px;
                 letter-spacing: 1px; }
    .status-pill { display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%;
           background: var(--red); animation: blink 1.4s infinite; }
    .dot.online { background: var(--green); }
    #status-text { font-size: 11px; color: var(--dim); letter-spacing: 1px; }

    /* ── Layout ───────────────────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      grid-template-rows: auto 1fr;
      gap: 8px; padding: 8px; height: calc(100vh - 45px);
    }

    /* ── Panel base ───────────────────────────────────────────────────── */
    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 4px; padding: 10px; position: relative; overflow: hidden;
    }
    .panel::before {
      content: attr(data-label);
      position: absolute; top: 0; left: 12px;
      font-size: 10px; color: var(--green-dim); letter-spacing: 2px;
      background: var(--panel); padding: 0 6px; transform: translateY(-50%);
    }

    /* ── Camera feed ──────────────────────────────────────────────────── */
    .camera-panel { grid-column: 1; grid-row: 1 / 3; }
    .camera-panel img {
      width: 100%; height: 100%; object-fit: contain;
      border: 1px solid var(--border); border-radius: 3px;
      filter: contrast(1.05) saturate(0.9);
    }
    .cam-overlay {
      position: absolute; top: 16px; left: 16px;
      font-size: 10px; color: var(--green); opacity: 0.7;
      pointer-events: none;
    }
    .rec { color: var(--red); animation: blink 1s infinite; }

    /* ── Telemetry panel ──────────────────────────────────────────────── */
    .telem-panel { grid-column: 2; grid-row: 1; }
    .telem-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px;
    }
    .metric {
      background: #080b0d; border: 1px solid var(--border);
      border-radius: 3px; padding: 6px 8px;
    }
    .metric-label { font-size: 9px; color: var(--dim); letter-spacing: 1px;
                    text-transform: uppercase; }
    .metric-value { font-size: 18px; color: var(--green);
                    text-shadow: 0 0 8px rgba(0,255,136,0.5); margin-top: 2px; }
    .metric-unit  { font-size: 9px; color: var(--dim); }

    .metric.amber .metric-value { color: var(--amber);
                                   text-shadow: 0 0 8px rgba(255,179,0,0.4); }
    .metric.cyan  .metric-value { color: var(--cyan);
                                   text-shadow: 0 0 8px rgba(0,229,255,0.4); }

    /* ── Mode badge ─────────────────────────────────────────────────────*/
    #mode-badge {
      display: inline-block; padding: 3px 10px; border-radius: 3px;
      font-size: 11px; letter-spacing: 3px; margin-top: 8px;
      background: #001a0a; border: 1px solid var(--green-dim);
      color: var(--green); text-shadow: 0 0 6px var(--green);
    }

    /* ── Foot contact indicators ─────────────────────────────────────── */
    .feet-row {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 4px; margin-top: 8px;
    }
    .foot {
      background: #080b0d; border: 1px solid var(--border);
      border-radius: 3px; padding: 5px 3px; text-align: center;
      font-size: 9px; color: var(--dim); letter-spacing: 1px;
      transition: all 0.1s;
    }
    .foot.contact { border-color: var(--green); color: var(--green);
                    box-shadow: inset 0 0 8px rgba(0,255,136,0.15); }
    .foot.swing   { border-color: var(--amber); color: var(--amber);
                    box-shadow: inset 0 0 8px rgba(255,179,0,0.15); }

    /* ── RPY bar ─────────────────────────────────────────────────────── */
    .rpy-bars { margin-top: 8px; }
    .rpy-row  { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .rpy-label{ font-size: 9px; color: var(--dim); width: 30px; }
    .rpy-track{
      flex: 1; height: 6px; background: #080b0d;
      border: 1px solid var(--border); border-radius: 3px; overflow: hidden;
    }
    .rpy-fill {
      height: 100%; background: var(--green); transition: width 0.1s;
      border-radius: 3px;
    }
    .rpy-val { font-size: 9px; color: var(--green); width: 38px; text-align: right; }

    /* ── Log panel ───────────────────────────────────────────────────── */
    .log-panel { grid-column: 2; grid-row: 2; }
    #log-output {
      height: calc(100% - 24px); overflow-y: auto; font-size: 11px;
      line-height: 1.6; padding-top: 6px;
    }
    .log-line { color: var(--dim); }
    .log-line.info  { color: var(--text); }
    .log-line.ok    { color: var(--green); }
    .log-line.warn  { color: var(--amber); }
    .log-line.error { color: var(--red); }
    .log-line::before { content: '▸ '; }

    /* ── Animations ──────────────────────────────────────────────────── */
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  </style>
</head>
<body>

<header>
  <div class="logo">ECHO-Q <span>CONTROL CENTER  v1.0.0  ·  ROS NOETIC</span></div>
  <div class="status-pill">
    <div class="dot" id="conn-dot"></div>
    <span id="status-text">CONNECTING …</span>
  </div>
</header>

<div class="grid">

  <!-- ── Camera ─────────────────────────────────────────────────────── -->
  <div class="panel camera-panel" data-label="// CAMERA FEED">
    <img src="/video_feed" alt="Camera Feed"/>
    <div class="cam-overlay">
      <span class="rec">● REC</span> &nbsp; LIVE  &nbsp; RPi CAM V2
    </div>
  </div>

  <!-- ── Telemetry ──────────────────────────────────────────────────── -->
  <div class="panel telem-panel" data-label="// TELEMETRY">
    <div id="mode-badge">MODE: REST</div>

    <div class="telem-grid">
      <div class="metric">
        <div class="metric-label">VEL X</div>
        <div class="metric-value" id="m-vx">0.00</div>
        <div class="metric-unit">m/s</div>
      </div>
      <div class="metric">
        <div class="metric-label">VEL Y</div>
        <div class="metric-value" id="m-vy">0.00</div>
        <div class="metric-unit">m/s</div>
      </div>
      <div class="metric cyan">
        <div class="metric-label">ODOM X</div>
        <div class="metric-value" id="m-ox">0.000</div>
        <div class="metric-unit">m</div>
      </div>
      <div class="metric cyan">
        <div class="metric-label">ODOM Y</div>
        <div class="metric-value" id="m-oy">0.000</div>
        <div class="metric-unit">m</div>
      </div>
      <div class="metric amber">
        <div class="metric-label">HEIGHT</div>
        <div class="metric-value" id="m-h">0.150</div>
        <div class="metric-unit">m</div>
      </div>
      <div class="metric amber">
        <div class="metric-label">YAW ω</div>
        <div class="metric-value" id="m-yr">0.00</div>
        <div class="metric-unit">rad/s</div>
      </div>
    </div>

    <!-- RPY bars -->
    <div class="rpy-bars">
      <div class="rpy-row">
        <div class="rpy-label">ROLL</div>
        <div class="rpy-track"><div class="rpy-fill" id="bar-roll" style="width:50%"></div></div>
        <div class="rpy-val"  id="val-roll">0.0°</div>
      </div>
      <div class="rpy-row">
        <div class="rpy-label">PITCH</div>
        <div class="rpy-track"><div class="rpy-fill" id="bar-pitch" style="width:50%"></div></div>
        <div class="rpy-val"  id="val-pitch">0.0°</div>
      </div>
      <div class="rpy-row">
        <div class="rpy-label">YAW</div>
        <div class="rpy-track"><div class="rpy-fill" id="bar-yaw" style="width:50%"></div></div>
        <div class="rpy-val"  id="val-yaw">0.0°</div>
      </div>
    </div>

    <!-- Foot contacts -->
    <div class="feet-row">
      <div class="foot" id="foot-FR">FR</div>
      <div class="foot" id="foot-FL">FL</div>
      <div class="foot" id="foot-BR">BR</div>
      <div class="foot" id="foot-BL">BL</div>
    </div>
  </div>

  <!-- ── Log ────────────────────────────────────────────────────────── -->
  <div class="panel log-panel" data-label="// SYSTEM LOG">
    <div id="log-output"></div>
  </div>

</div>

<script>
  const LEG_NAMES = ['FR','FL','BR','BL'];
  let tick = 0;

  function log(msg, cls='info') {
    const el = document.getElementById('log-output');
    const line = document.createElement('div');
    line.className = 'log-line ' + cls;
    const ts = new Date().toTimeString().slice(0,8);
    line.textContent = `[${ts}] ${msg}`;
    el.appendChild(line);
    if (el.children.length > 80) el.removeChild(el.firstChild);
    el.scrollTop = el.scrollHeight;
  }

  function setBar(id, val, min=-45, max=45) {
    const pct = ((val - min) / (max - min)) * 100;
    document.getElementById(id).style.width = Math.max(0, Math.min(100, pct)) + '%';
  }

  async function poll() {
    try {
      const r   = await fetch('/api/state');
      const s   = await r.json();
      tick++;

      // Connection dot
      document.getElementById('conn-dot').className = 'dot online';
      document.getElementById('status-text').textContent = 'ONLINE  ·  TICK ' + (s.tick || tick);

      // Mode badge
      const badge = document.getElementById('mode-badge');
      badge.textContent = 'MODE: ' + (s.mode || 'UNKNOWN');
      badge.style.borderColor = s.mode === 'TROT' ? 'var(--green)' :
                                s.mode === 'NAVIGATE' ? 'var(--cyan)' :
                                s.mode === 'REST'  ? '#334433' : 'var(--amber)';

      // Metrics
      document.getElementById('m-vx').textContent = (s.vx  || 0).toFixed(2);
      document.getElementById('m-vy').textContent = (s.vy  || 0).toFixed(2);
      document.getElementById('m-ox').textContent = (s.odom_x || 0).toFixed(3);
      document.getElementById('m-oy').textContent = (s.odom_y || 0).toFixed(3);
      document.getElementById('m-h' ).textContent = Math.abs(s.height || 0.15).toFixed(3);
      document.getElementById('m-yr').textContent = (s.yaw_rate || 0).toFixed(2);

      // RPY bars
      const roll  = s.roll  || 0;
      const pitch = s.pitch || 0;
      const yaw   = s.yaw   || 0;
      setBar('bar-roll',  roll,  -45, 45);
      setBar('bar-pitch', pitch, -45, 45);
      setBar('bar-yaw',   yaw,  -180, 180);
      document.getElementById('val-roll' ).textContent = roll.toFixed(1)  + '°';
      document.getElementById('val-pitch').textContent = pitch.toFixed(1) + '°';
      document.getElementById('val-yaw'  ).textContent = yaw.toFixed(1)   + '°';

      // Foot contacts
      const contacts = s.contacts || [true,true,true,true];
      LEG_NAMES.forEach((leg, i) => {
        const el = document.getElementById('foot-' + leg);
        el.className = 'foot ' + (contacts[i] ? 'contact' : 'swing');
      });

      // Log occasionally
      if (tick % 10 === 0) {
        log(`mode=${s.mode}  vx=${(s.vx||0).toFixed(2)}  odom=[${(s.odom_x||0).toFixed(2)},${(s.odom_y||0).toFixed(2)}]`, 'ok');
      }

    } catch(e) {
      document.getElementById('conn-dot').className = 'dot';
      document.getElementById('status-text').textContent = 'OFFLINE';
      log('Connection lost: ' + e.message, 'error');
    }
  }

  log('ECHO-Q Web Interface initialised', 'ok');
  log('Connecting to robot state API …', 'info');
  setInterval(poll, 200);   // 5 Hz telemetry refresh
</script>
</body>
</html>
